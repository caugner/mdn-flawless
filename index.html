<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MDN Flawless</title>
<style>
  :root {
    --bg: #fafafa;
    --fg: #222;
    --muted: #777;
    --border: #ddd;
    --accent: #0066cc;
    --row-alt: #f3f3f3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1a1a1a;
      --fg: #e6e6e6;
      --muted: #999;
      --border: #333;
      --accent: #66aaff;
      --row-alt: #232323;
    }
  }
  html, body { margin: 0; padding: 0; }
  body {
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    z-index: 10;
  }
  .row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .row + .row { margin-top: 8px; }
  .btn-group { display: inline-flex; gap: 6px; }
  label {
    display: inline-flex;
    flex-direction: column;
    font-size: 11px;
    color: var(--muted);
    gap: 2px;
  }
  input[type=text], select {
    font: inherit;
    padding: 4px 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    border-radius: 3px;
    min-width: 140px;
  }
  input[type=text].wide { min-width: 320px; }
  button {
    font: inherit;
    padding: 4px 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--fg);
    border-radius: 3px;
    cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; border-color: var(--border); color: var(--fg); }
  button.active { border-color: var(--accent); color: var(--accent); }
  input.active, select.active { border-color: var(--accent); color: var(--accent); }
  .stats { color: var(--muted); margin-left: auto; }
  table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
  }
  th, td {
    text-align: left;
    padding: 6px 8px;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
    overflow-wrap: anywhere;
  }
  th {
    position: sticky;
    top: 0;
    background: var(--bg);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  tr:nth-child(even) td { background: var(--row-alt); }
  td.file { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--muted); }
  td.file .path { color: var(--fg); }
  td.file a { color: inherit; text-decoration: none; }
  td.file a:hover { text-decoration: underline; text-decoration-color: var(--accent); }
  td.file a:hover .path { color: var(--accent); }
  td.msg { white-space: pre-wrap; }
  td.msg a { color: inherit; text-decoration: none; }
  td.msg a:hover { color: var(--accent); text-decoration: underline; }
  .pill {
    display: inline-block;
    padding: 1px 6px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 11px;
    color: var(--muted);
    margin-right: 4px;
  }
  button.pill { background: transparent; }
  span.pill { border-radius: 3px; }
  td.msg > div { margin-top: 4px; }
  .empty, .loading {
    padding: 40px;
    text-align: center;
    color: var(--muted);
  }
  .loading progress {
    width: min(420px, 70vw);
    height: 8px;
    margin-top: 12px;
  }
  button.group-toggle {
    background: none;
    border: 0;
    padding: 0;
    margin: 0;
    font: inherit;
    color: inherit;
    text-align: left;
    cursor: pointer;
    overflow-wrap: anywhere;
  }
  button.group-toggle:hover { color: var(--accent); }
  button.group-toggle:hover .path { color: var(--accent); }
  button.group-toggle .caret-glyph {
    display: inline-block;
    width: 1em;
    margin-right: 4px;
    color: var(--muted);
  }
  button.group-toggle:hover .caret-glyph { color: var(--accent); }
  .muted { color: var(--muted); }
  tr.group-child td { background: var(--row-alt); }
  tr.group-child td.file { padding-left: 24px; }
  td.count { font-variant-numeric: tabular-nums; }
  th[data-sort]::after, th[data-gsort]::after { content: " ⇅"; opacity: 0.3; }
  th[data-sort].asc::after, th[data-gsort].asc::after { content: " ↑"; opacity: 1; }
  th[data-sort].desc::after, th[data-gsort].desc::after { content: " ↓"; opacity: 1; }
  .pager { display: flex; gap: 6px; align-items: center; }
  mark { background: #ffd54f; color: #000; }
  .github-fork {
    position: fixed;
    bottom: 12px;
    right: 12px;
    z-index: 100;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    background: var(--fg);
    color: var(--bg);
    text-decoration: none;
    border-radius: 4px;
    font-size: 12px;
    opacity: 0.85;
  }
  .github-fork:hover { opacity: 1; }
  .github-fork svg { fill: currentColor; }
</style>
</head>
<body>
<header>
  <div class="row">
    <label>Search
      <input type="text" id="q" autocomplete="off" class="wide" placeholder="message, file, url, redirect, source, slug…" autofocus>
    </label>
    <label>File path contains
      <input type="text" id="filePath" placeholder="e.g. /en-us/web/css">
    </label>
    <label>Copy issues as
      <div class="btn-group">
        <button id="copyMd" title="Copy filtered list as Markdown table">Markdown</button>
        <button id="copyCsv" title="Copy filtered list as CSV">CSV</button>
        <button id="copyJson" title="Copy filtered list as JSON">JSON</button>
      </div>
    </label>
    <span class="stats" id="stats" aria-live="polite">Loading…</span>
  </div>
  <div class="row">
    <label>Repository
      <select id="repo"><option value="">All</option></select>
    </label>
    <label>Locale
      <select id="locale"><option value="">All</option></select>
    </label>
    <label>Category
      <select id="category"><option value="">All</option></select>
    </label>
    <label>Macro (templ)
      <select id="templ"><option value="">All</option></select>
    </label>
    <label>Source position
      <select id="sourcepos">
        <option value="">All</option>
        <option value="yes">With</option>
        <option value="no">Without</option>
      </select>
    </label>
    <label>Group by
      <select id="groupBy">
        <option value="">None</option>
        <option value="sourceCategory">Category</option>
        <option value="url">URL</option>
        <option value="slug">Slug</option>
        <option value="filePath">File path</option>
      </select>
    </label>
  </div>
  <div class="row">
    <div class="pager">
      <button id="prev" aria-label="Previous page">◀ Prev</button>
      <span id="pageInfo">—</span>
      <button id="next" aria-label="Next page">Next ▶</button>
      <label style="flex-direction: row; align-items: center; gap: 4px;">
        Page size
        <select id="pageSize" style="min-width: 0">
          <option>50</option>
          <option selected>200</option>
          <option>500</option>
          <option>2000</option>
        </select>
      </label>
      <button id="reset">Reset</button>
    </div>
  </div>
</header>

<div id="content">
  <div class="loading">
    <div id="loadingLabel">Loading issues.json…</div>
    <progress id="loadingBar" value="0" max="1"></progress>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const state = {
    all: [],
    filtered: [],
    groups: [],
    expanded: new Set(),
    page: 0,
    pageSize: 200,
    sortKey: null,
    sortDir: 1,
    groupSortKey: "count",
    groupSortDir: -1,
  };

  // Categorize a message into a coarse bucket. Keep the longest matching prefix.
  const CATEGORIES = [
    "page(Doc) not found",
    "page not found",
    "CSS syntax not available",
    "Invalid slug for templ/sidebar",
    "invalid templ",
    "Error opening",
    "Error parsing",
    "Parse error",
    "Multiple browser-compat entries",
    "must be provided",
    "invalid url",
    "Error: could not find syntax",
    "redirected",
  ];
  function categorize(msg) {
    if (!msg) return "(none)";
    for (const p of CATEGORIES) if (msg.startsWith(p)) return p;
    // Fall back to the part before ":" or first 4 words.
    const colon = msg.indexOf(":");
    if (colon > 0 && colon < 40) return msg.slice(0, colon);
    return msg.split(/\s+/).slice(0, 4).join(" ");
  }

  // Strip absolute path prefixes leading up to `(translated-)content/files/` or `curriculum/curriculum/`.
  const PATH_PREFIX_RE = /\/[^\s]*?(?=(?:translated-content|content)\/files\/|curriculum\/curriculum\/)/g;
  function stripPathPrefix(s) {
    return s ? s.replace(PATH_PREFIX_RE, "") : s;
  }

  function pairsToObj(pairs) {
    const o = {};
    if (!pairs) return o;
    for (const [k, v] of pairs) o[k] = v;
    return o;
  }

  // Identify the repo from the file path. de locale lives in translated-content-de
  // despite the stored path saying translated-content/files.
  const REPO_PREFIXES = ["content", "translated-content", "curriculum"];
  function detectRepo(filePath, locale) {
    for (const r of REPO_PREFIXES) {
      if (filePath.startsWith(r + "/")) {
        return r === "translated-content" && locale === "de" ? "translated-content-de" : r;
      }
    }
    return "unknown";
  }

  function flatten(data) {
    const out = [];
    for (const [rawFilePath, issues] of Object.entries(data)) {
      const filePath = stripPathPrefix(rawFilePath);
      for (const it of issues) {
        const fields = pairsToObj(it.fields);
        const spans = pairsToObj(it.spans);
        const message = stripPathPrefix(fields.message || "");
        const source = fields.source || "";
        // When a source has no message (e.g. broken-link), the source IS the category.
        const category = message ? categorize(message) : (source || "(none)");
        const locale = spans.locale || "";
        out.push({
          filePath,
          file: stripPathPrefix(it.file || ""),
          line: it.line || 0,
          col: it.col || 0,
          endLine: it.end_line || 0,
          endCol: it.end_col || 0,
          message,
          source,
          redirect: stripPathPrefix(fields.redirect || ""),
          url: fields.url || "",
          locale,
          slug: spans.slug || "",
          basepath: spans.basepath || "",
          templ: spans.templ || "",
          sidebar: spans.sidebar || "",
          category,
          // If the source already serves as the category, don't repeat it.
          sourceCategory: source && message ? `${source}: ${category}` : category,
          repo: detectRepo(filePath, locale),
        });
      }
    }
    return out;
  }

  // Rebuild a select's options from a counts map, preserving the current selection
  // even if the value is no longer present (shown with count 0).
  function refreshSelect(sel, counts) {
    const current = sel.value;
    while (sel.options.length > 1) sel.remove(1);
    const keys = [...counts.keys()].sort((a, b) => a.localeCompare(b));
    if (current && !counts.has(current)) keys.push(current);
    for (const v of keys) {
      const opt = document.createElement("option");
      opt.value = v;
      opt.textContent = `${v} (${(counts.get(v) || 0).toLocaleString()})`;
      sel.appendChild(opt);
    }
    sel.value = current;
  }

  const SEARCH_FIELDS = ["message", "filePath", "file", "url", "redirect", "source", "slug", "basepath", "templ", "sidebar"];

  // Returns true if `it` passes every active filter EXCEPT the one named in `except`.
  function passes(it, f, except) {
    if (except !== "category" && f.cat && it.sourceCategory !== f.cat) return false;
    if (except !== "repo" && f.repo && it.repo !== f.repo) return false;
    if (except !== "locale" && f.loc && it.locale !== f.loc) return false;
    if (except !== "templ" && f.tmpl && it.templ !== f.tmpl) return false;
    if (except !== "sourcepos" && f.pos === "yes" && !it.line) return false;
    if (except !== "sourcepos" && f.pos === "no" && it.line) return false;
    if (f.fp && !it.filePath.toLowerCase().includes(f.fp)) return false;
    if (f.tokens.length) {
      const hay = SEARCH_FIELDS.map(k => it[k]).join(" \n ").toLowerCase();
      for (const t of f.tokens) if (!hay.includes(t)) return false;
    }
    return true;
  }

  // Filter ↔ URL hash mapping. Param names are short and stable.
  const HASH_FIELDS = [
    ["q", "q"],
    ["category", "category"],
    ["repo", "repo"],
    ["locale", "locale"],
    ["templ", "templ"],
    ["sourcepos", "pos"],
    ["filePath", "file"],
    ["groupBy", "group"],
  ];

  function readHashIntoInputs() {
    const params = new URLSearchParams(location.hash.replace(/^#/, ""));
    for (const [id, key] of HASH_FIELDS) {
      const v = params.get(key) || "";
      const el = $(id);
      // For dropdowns, ensure the desired value is selectable before refreshSelect rebuilds it.
      if (el.tagName === "SELECT" && v && !Array.from(el.options).some(o => o.value === v)) {
        const opt = document.createElement("option");
        opt.value = v;
        opt.textContent = v;
        el.appendChild(opt);
      }
      el.value = v;
    }
  }

  function writeInputsToHash() {
    const params = new URLSearchParams();
    for (const [id, key] of HASH_FIELDS) {
      const v = $(id).value.trim();
      if (v) params.set(key, v);
    }
    const s = params.toString();
    const target = s ? "#" + s : location.pathname + location.search;
    if (location.href.endsWith(target) || (s === "" && !location.hash)) return;
    history.replaceState(null, "", target);
  }

  function applyFilters() {
    const q = $("q").value.trim().toLowerCase();
    const f = {
      cat: $("category").value,
      repo: $("repo").value,
      loc: $("locale").value,
      tmpl: $("templ").value,
      pos: $("sourcepos").value,
      fp: $("filePath").value.trim().toLowerCase(),
      tokens: q ? q.split(/\s+/) : [],
    };
    writeInputsToHash();
    const group = $("groupBy").value;
    $("reset").classList.toggle("active", !!(f.cat || f.repo || f.loc || f.tmpl || f.pos || f.fp || group || f.tokens.length));
    $("groupBy").classList.toggle("active", !!group);
    $("q").classList.toggle("active", f.tokens.length > 0);
    $("category").classList.toggle("active", !!f.cat);
    $("repo").classList.toggle("active", !!f.repo);
    $("locale").classList.toggle("active", !!f.loc);
    $("templ").classList.toggle("active", !!f.tmpl);
    $("sourcepos").classList.toggle("active", !!f.pos);
    $("filePath").classList.toggle("active", !!f.fp);

    // Single pass: build filtered list and per-facet counts (each excluding its own filter).
    state.filtered = [];
    const catCounts = new Map();
    const repoCounts = new Map();
    const locCounts = new Map();
    const tmplCounts = new Map();
    let posWith = 0, posWithout = 0;
    for (const it of state.all) {
      if (passes(it, f, null)) state.filtered.push(it);
      if (it.sourceCategory && passes(it, f, "category")) catCounts.set(it.sourceCategory, (catCounts.get(it.sourceCategory) || 0) + 1);
      if (it.repo && passes(it, f, "repo")) repoCounts.set(it.repo, (repoCounts.get(it.repo) || 0) + 1);
      if (it.locale && passes(it, f, "locale")) locCounts.set(it.locale, (locCounts.get(it.locale) || 0) + 1);
      if (it.templ && passes(it, f, "templ")) tmplCounts.set(it.templ, (tmplCounts.get(it.templ) || 0) + 1);
      if (passes(it, f, "sourcepos")) { if (it.line) posWith++; else posWithout++; }
    }

    refreshSelect($("category"), catCounts);
    refreshSelect($("repo"), repoCounts);
    refreshSelect($("locale"), locCounts);
    refreshSelect($("templ"), tmplCounts);
    const posSel = $("sourcepos");
    posSel.options[1].textContent = `With (${posWith.toLocaleString()})`;
    posSel.options[2].textContent = `Without (${posWithout.toLocaleString()})`;

    if (state.sortKey) sortFiltered();
    buildGroups();
    state.expanded.clear();
    state.page = 0;
    render();
  }

  function sortFiltered() {
    const k = state.sortKey, d = state.sortDir;
    state.filtered.sort((a, b) => {
      const av = a[k], bv = b[k];
      if (typeof av === "number" && typeof bv === "number") return (av - bv) * d;
      return String(av).localeCompare(String(bv)) * d;
    });
  }

  const GROUP_LABELS = { sourceCategory: "Category", url: "URL", slug: "Slug", filePath: "File path" };

  function buildGroups() {
    const g = $("groupBy").value;
    if (!g) { state.groups = []; return; }
    const map = new Map();
    for (const it of state.filtered) {
      const key = it[g] || "(none)";
      let bucket = map.get(key);
      if (!bucket) { bucket = { key, count: 0, items: [] }; map.set(key, bucket); }
      bucket.count++;
      bucket.items.push(it);
    }
    state.groups = [...map.values()];
    sortGroups();
  }

  function sortGroups() {
    const k = state.groupSortKey, d = state.groupSortDir;
    state.groups.sort((a, b) => {
      if (k === "count") return (a.count - b.count) * d || a.key.localeCompare(b.key);
      return a.key.localeCompare(b.key) * d;
    });
  }

  // Split off the repo prefix (content/, translated-content/, curriculum/) for display as a pill.
  // de locale lives in translated-content-de despite the stored path saying translated-content/files.
  function splitRepoPrefix(fp, locale) {
    const repos = ["content", "translated-content", "curriculum"];
    for (const r of repos) {
      const p = r + "/";
      if (fp.startsWith(p)) {
        const repo = r === "translated-content" && locale === "de" ? "translated-content-de" : r;
        return { repo, rest: fp.slice(p.length) };
      }
    }
    return { repo: "", rest: fp };
  }

  // Build a GitHub blob URL for paths under content/files/, translated-content/files/, or curriculum/curriculum/.
  // line/col/end_line/end_col are 0-based in issues.json; GitHub anchors are 1-based.
  function githubUrl(it) {
    const fp = it.filePath;
    if (!fp) return null;
    let m = fp.match(/^content\/files\/(.+)$/);
    let repo = m ? "content" : null;
    let folder = m ? "files" : null;
    if (!m) {
      m = fp.match(/^translated-content\/files\/(.+)$/);
      if (m) { repo = it.locale === "de" ? "translated-content-de" : "translated-content"; folder = "files"; }
    }
    if (!m) {
      m = fp.match(/^curriculum\/curriculum\/(.+)$/);
      if (m) { repo = "curriculum"; folder = "curriculum"; }
    }
    if (!m) return null;
    const base = `https://github.com/mdn/${repo}/blob/main/${folder}/${m[1]}`;
    if (!it.line) return base;
    let anchor = `L${it.line + 1}`;
    if (it.col) anchor += `C${it.col + 1}`;
    if (it.endLine && (it.endLine !== it.line || it.endCol !== it.col)) {
      anchor += `-L${it.endLine + 1}`;
      if (it.endCol) anchor += `C${it.endCol + 1}`;
    }
    return `${base}?plain=1#${anchor}`;
  }

  // Normalize a stored locale (e.g. "en-us", "pt-br") to MDN's URL casing ("en-US", "pt-BR").
  function mdnLocale(loc) {
    if (!loc) return "";
    const [lang, ...rest] = loc.split("-");
    return [lang.toLowerCase(), ...rest.map(p => p.toUpperCase())].join("-");
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[c]);
  }

  function highlight(text, tokens) {
    let s = escapeHtml(text);
    if (!tokens.length) return s;
    for (const t of tokens) {
      if (!t) continue;
      const re = new RegExp("(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "gi");
      s = s.replace(re, "<mark>$1</mark>");
    }
    return s;
  }

  function issueRowHtml(it, tokens, hideLocale, hideTempl, hideCategory, childClass) {
    const loc = it.locale && !hideLocale ? `<button type="button" class="pill" data-filter="locale" data-value="${escapeHtml(it.locale)}" aria-label="Filter by locale: ${escapeHtml(it.locale)}">${escapeHtml(it.locale)}</button>` : "";
    const tmpl = it.templ && !hideTempl ? `<button type="button" class="pill" data-filter="templ" data-value="${escapeHtml(it.templ)}" aria-label="Filter by macro: ${escapeHtml(it.templ)}">${escapeHtml(it.templ)}</button>` : "";
    const slugText = highlight(it.slug, tokens);
    const slugLinked = it.locale && it.slug
      ? `<a href="https://developer.mozilla.org/${escapeHtml(mdnLocale(it.locale))}/docs/${escapeHtml(it.slug)}" target="_blank" rel="noopener">${slugText}</a>`
      : slugText;
    const slug = it.slug ? `<div><span class="pill">slug</span>${slugLinked}</div>` : "";
    const url = it.url ? `<div><span class="pill">url</span>${highlight(it.url, tokens)}</div>` : "";
    const redirect = it.redirect ? `<div><span class="pill">→</span>${highlight(it.redirect, tokens)}</div>` : "";
    const lineCol = it.line ? `:${it.line}${it.col ? ":" + it.col : ""}` : "";
    const split = splitRepoPrefix(it.filePath || "", it.locale);
    const repoPill = `<button type="button" class="pill" data-filter="repo" data-value="${escapeHtml(it.repo)}" aria-label="Filter by repo: ${escapeHtml(it.repo)}">${escapeHtml(it.repo)}</button>`;
    const pathHtml = split.rest ? `<span class="path">${highlight(split.rest, tokens)}</span>${escapeHtml(lineCol)}` : "";
    const ghUrl = githubUrl(it);
    const fileCell = ghUrl
      ? `${repoPill}<a href="${escapeHtml(ghUrl)}" target="_blank" rel="noopener">${pathHtml}</a>`
      : `${repoPill}${pathHtml}`;
    const catCell = hideCategory ? "" : `<td><button type="button" class="pill" data-filter="category" data-value="${escapeHtml(it.sourceCategory)}" aria-label="Filter by category: ${escapeHtml(it.sourceCategory)}">${escapeHtml(it.sourceCategory)}</button></td>`;
    return `<tr${childClass ? ` class="${childClass}"` : ""}>
      <td class="file">${fileCell}</td>
      ${catCell}
      <td class="msg">${loc}${tmpl}${highlight(it.message, tokens)}${slug}${url}${redirect}</td>
    </tr>`;
  }

  function render() {
    const grandTotal = state.all.length;
    const totalIssues = state.filtered.length;
    const ps = state.pageSize;
    const group = $("groupBy").value;
    const grouped = !!group;
    const total = grouped ? state.groups.length : totalIssues;
    const pages = Math.max(1, Math.ceil(total / ps));
    if (state.page >= pages) state.page = pages - 1;
    if (state.page < 0) state.page = 0;
    const start = state.page * ps;

    const files = new Set();
    const slugs = new Set();
    for (const it of state.filtered) {
      if (it.filePath) files.add(it.filePath);
      if (it.slug) slugs.add(it.slug);
    }
    const fileSlugStat = files.size === slugs.size
      ? `${files.size.toLocaleString()} files/slugs`
      : `${files.size.toLocaleString()} files · ${slugs.size.toLocaleString()} slugs`;
    const groupStat = grouped ? `${state.groups.length.toLocaleString()} ${GROUP_LABELS[group].toLowerCase()} groups · ` : "";
    $("stats").textContent = `${groupStat}${totalIssues.toLocaleString()} of ${grandTotal.toLocaleString()} issues · ${fileSlugStat}`;
    const unit = grouped ? "groups" : "issues";
    $("pageInfo").textContent = total
      ? `${(start + 1).toLocaleString()}–${Math.min(start + ps, total).toLocaleString()} ${unit} · page ${state.page + 1} / ${pages}`
      : "—";
    $("prev").disabled = state.page <= 0;
    $("next").disabled = state.page >= pages - 1;

    const tokens = $("q").value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    const content = $("content");

    if (!total) {
      content.innerHTML = '<div class="empty">No matching issues.</div>';
      return;
    }

    const hideLocale = !!$("locale").value;
    const hideTempl = !!$("templ").value;
    const hideCategory = !!$("category").value;

    if (grouped) {
      renderGrouped(content, start, ps, tokens, group, hideLocale, hideTempl, hideCategory);
      return;
    }

    const slice = state.filtered.slice(start, start + ps);
    const rows = slice.map(it => issueRowHtml(it, tokens, hideLocale, hideTempl, hideCategory)).join("");

    const cols = hideCategory
      ? `<col style="width:42%"><col style="width:58%">`
      : `<col style="width:38%"><col style="width:18%"><col style="width:44%">`;
    const catHead = hideCategory ? "" : `<th data-sort="sourceCategory" class="${sortClass('sourceCategory')}" tabindex="0" role="button" aria-sort="${ariaSort('sourceCategory')}">Category</th>`;
    content.innerHTML = `<table>
      <colgroup>${cols}</colgroup>
      <thead><tr>
        <th data-sort="filePath" class="${sortClass('filePath')}" tabindex="0" role="button" aria-sort="${ariaSort('filePath')}">File</th>
        ${catHead}
        <th data-sort="message" class="${sortClass('message')}" tabindex="0" role="button" aria-sort="${ariaSort('message')}">Message</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

    for (const th of content.querySelectorAll("th[data-sort]")) {
      const activate = () => {
        const k = th.dataset.sort;
        if (state.sortKey === k) state.sortDir = -state.sortDir;
        else { state.sortKey = k; state.sortDir = 1; }
        sortFiltered();
        render();
      };
      th.addEventListener("click", activate);
      th.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          activate();
        }
      });
    }
  }

  function groupKeyInner(key, group, items, tokens) {
    if (key === "(none)") return `<span class="muted">(none)</span>`;
    if (group === "filePath") {
      const it = items[0];
      const split = splitRepoPrefix(key, it && it.locale);
      return `<span class="path">${highlight(split.rest, tokens)}</span>`;
    }
    return highlight(key, tokens);
  }

  function groupRepoPill(key, group, items) {
    if (group !== "filePath" || key === "(none)") return "";
    const it = items[0];
    if (!it) return "";
    return `<button type="button" class="pill" data-filter="repo" data-value="${escapeHtml(it.repo)}" aria-label="Filter by repo: ${escapeHtml(it.repo)}">${escapeHtml(it.repo)}</button>`;
  }

  function renderGrouped(content, start, ps, tokens, group, hideLocale, hideTempl, hideCategory) {
    const slice = state.groups.slice(start, start + ps);
    const sampleColLabel = "Sample";
    const rows = slice.map(g => {
      const expanded = state.expanded.has(g.key);
      const repoPill = groupRepoPill(g.key, group, g.items);
      const toggle = `<button type="button" class="group-toggle" data-toggle-group="${escapeHtml(g.key)}" aria-expanded="${expanded}"><span class="caret-glyph" aria-hidden="true">${expanded ? "▼" : "▶"}</span>${groupKeyInner(g.key, group, g.items, tokens)}</button>`;
      const sample = g.items[0];
      const sampleCat = (hideCategory || !sample) ? "" : `<button type="button" class="pill" data-filter="category" data-value="${escapeHtml(sample.sourceCategory)}" aria-label="Filter by category: ${escapeHtml(sample.sourceCategory)}">${escapeHtml(sample.sourceCategory)}</button> `;
      const sampleMsg = sample ? `${sampleCat}${highlight(sample.message || sample.source || "", tokens)}` : "";
      const main = `<tr>
        <td class="file">${repoPill}${toggle}</td>
        <td class="count">${g.count.toLocaleString()}</td>
        <td class="msg">${sampleMsg}</td>
      </tr>`;
      if (!expanded) return main;
      const children = g.items.map(it => issueRowHtml(it, tokens, hideLocale, hideTempl, hideCategory, "group-child")).join("");
      return main + children;
    }).join("");

    const cols = `<col style="width:50%"><col style="width:10%"><col style="width:40%">`;
    const keyLabel = GROUP_LABELS[group];
    content.innerHTML = `<table>
      <colgroup>${cols}</colgroup>
      <thead><tr>
        <th data-gsort="key" class="${groupSortClass('key')}" tabindex="0" role="button" aria-sort="${groupAriaSort('key')}">${escapeHtml(keyLabel)}</th>
        <th data-gsort="count" class="${groupSortClass('count')}" tabindex="0" role="button" aria-sort="${groupAriaSort('count')}">Count</th>
        <th>${escapeHtml(sampleColLabel)}</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;

    for (const th of content.querySelectorAll("th[data-gsort]")) {
      const activate = () => {
        const k = th.dataset.gsort;
        if (state.groupSortKey === k) state.groupSortDir = -state.groupSortDir;
        else { state.groupSortKey = k; state.groupSortDir = k === "count" ? -1 : 1; }
        sortGroups();
        render();
      };
      th.addEventListener("click", activate);
      th.addEventListener("keydown", e => {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); activate(); }
      });
    }

    for (const btn of content.querySelectorAll("button.group-toggle[data-toggle-group]")) {
      btn.addEventListener("click", () => {
        const key = btn.dataset.toggleGroup;
        if (state.expanded.has(key)) state.expanded.delete(key);
        else state.expanded.add(key);
        render();
      });
    }
  }

  function groupSortClass(k) {
    if (state.groupSortKey !== k) return "";
    return state.groupSortDir > 0 ? "asc" : "desc";
  }

  function groupAriaSort(k) {
    if (state.groupSortKey !== k) return "none";
    return state.groupSortDir > 0 ? "ascending" : "descending";
  }

  function sortClass(k) {
    if (state.sortKey !== k) return "";
    return state.sortDir > 0 ? "asc" : "desc";
  }

  function ariaSort(k) {
    if (state.sortKey !== k) return "none";
    return state.sortDir > 0 ? "ascending" : "descending";
  }

  function bind() {
    const onChange = () => applyFilters();
    let qTimer;
    $("q").addEventListener("input", () => {
      clearTimeout(qTimer);
      qTimer = setTimeout(onChange, 120);
    });
    $("filePath").addEventListener("input", () => {
      clearTimeout(qTimer);
      qTimer = setTimeout(onChange, 120);
    });
    for (const id of ["category", "repo", "locale", "templ", "sourcepos", "groupBy"]) $(id).addEventListener("change", onChange);
    $("pageSize").addEventListener("change", () => {
      state.pageSize = parseInt($("pageSize").value, 10) || 200;
      state.page = 0;
      render();
    });
    $("content").addEventListener("click", e => {
      const btn = e.target.closest("button.pill[data-filter]");
      if (!btn) return;
      const sel = $(btn.dataset.filter);
      if (!sel) return;
      sel.value = btn.dataset.value;
      applyFilters();
    });
    $("prev").addEventListener("click", () => { state.page--; render(); });
    $("next").addEventListener("click", () => { state.page++; render(); });
    $("reset").addEventListener("click", () => {
      $("q").value = "";
      $("filePath").value = "";
      $("category").value = "";
      $("repo").value = "";
      $("locale").value = "";
      $("templ").value = "";
      $("sourcepos").value = "";
      $("groupBy").value = "";
      state.sortKey = null;
      state.expanded.clear();
      applyFilters();
    });
    $("copyMd").addEventListener("click", () => copyExport($("copyMd"), buildMarkdown));
    $("copyCsv").addEventListener("click", () => copyExport($("copyCsv"), buildCsv));
    $("copyJson").addEventListener("click", () => copyExport($("copyJson"), buildJson));
  }

  function activeFilterSummary() {
    const parts = [];
    for (const [id, key] of HASH_FIELDS) {
      const v = $(id).value.trim();
      if (v) parts.push(`${key}=${v}`);
    }
    return parts.join(" · ");
  }

  function mdCell(s) {
    return String(s ?? "").replace(/\\/g, "\\\\").replace(/\|/g, "\\|").replace(/\r?\n/g, " ");
  }

  function buildMarkdown() {
    const total = state.filtered.length;
    const filters = activeFilterSummary();
    const group = $("groupBy").value;
    const lines = [];
    lines.push(`[${total.toLocaleString()} issues — live view](${location.href})`);
    if (filters) lines.push(`\n**Filters:** ${filters}`);
    lines.push("");
    if (group) {
      const label = GROUP_LABELS[group];
      lines.push(`| ${label} | Count |`);
      lines.push("|---|---:|");
      for (const g of state.groups) lines.push(`| ${mdCell(g.key)} | ${g.count} |`);
      return lines.join("\n");
    }
    lines.push("| Category | File | Slug | Message |");
    lines.push("|---|---|---|---|");
    for (const it of state.filtered) {
      const lineCol = it.line ? `:${it.line}${it.col ? ":" + it.col : ""}` : "";
      const fileLabel = `${it.filePath || ""}${lineCol}`;
      const gh = githubUrl(it);
      const fileCell = gh ? `[${mdCell(fileLabel)}](${gh})` : mdCell(fileLabel);
      const slugCell = it.slug && it.locale
        ? `[${mdCell(it.slug)}](https://developer.mozilla.org/${mdnLocale(it.locale)}/docs/${it.slug})`
        : mdCell(it.slug || "");
      let msg = it.message || "";
      if (!msg) {
        if (it.url && it.redirect) msg = `${it.url} → ${it.redirect}`;
        else msg = it.url || it.redirect || "";
      }
      lines.push(`| ${mdCell(it.sourceCategory || "")} | ${fileCell} | ${slugCell} | ${mdCell(msg)} |`);
    }
    return lines.join("\n");
  }

  function csvField(s) {
    const v = s == null ? "" : String(s);
    return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v;
  }

  function buildCsv() {
    const group = $("groupBy").value;
    if (group) {
      const rows = [[GROUP_LABELS[group].toLowerCase().replace(/\s+/g, "_"), "count"].join(",")];
      for (const g of state.groups) rows.push([csvField(g.key), g.count].join(","));
      return rows.join("\r\n");
    }
    const cols = ["repo", "file", "line", "col", "locale", "category", "templ", "message", "slug", "url", "redirect", "github_url"];
    const rows = [cols.join(",")];
    for (const it of state.filtered) {
      rows.push([
        it.repo, it.filePath, it.line ?? "", it.col ?? "",
        it.locale, it.sourceCategory, it.templ, it.message,
        it.slug, it.url, it.redirect, githubUrl(it) || "",
      ].map(csvField).join(","));
    }
    return rows.join("\r\n");
  }

  function buildJson() {
    const items = state.filtered.map(it => ({
      repo: it.repo || "",
      file: it.filePath || "",
      line: it.line ?? null,
      col: it.col ?? null,
      locale: it.locale || "",
      category: it.sourceCategory || "",
      templ: it.templ || "",
      message: it.message || "",
      slug: it.slug || "",
      url: it.url || "",
      redirect: it.redirect || "",
      github_url: githubUrl(it) || "",
    }));
    return JSON.stringify(items, null, 2);
  }

  async function copyExport(btn, build) {
    const original = btn.textContent;
    try {
      const text = build();
      await navigator.clipboard.writeText(text);
      const n = $("groupBy").value ? state.groups.length : state.filtered.length;
      btn.textContent = `Copied ${n.toLocaleString()}`;
    } catch (e) {
      btn.textContent = "Copy failed";
      console.error(e);
    }
    setTimeout(() => { btn.textContent = original; }, 1500);
  }

  function fmtBytes(n) {
    if (n >= 1e9) return (n / 1e9).toFixed(2) + " GB";
    if (n >= 1e6) return (n / 1e6).toFixed(1) + " MB";
    if (n >= 1e3) return (n / 1e3).toFixed(0) + " KB";
    return n + " B";
  }

  async function load() {
    const t0 = performance.now();
    const label = $("loadingLabel");
    const bar = $("loadingBar");
    let res;
    try {
      res = await fetch("issues.json");
    } catch (e) {
      $("content").innerHTML = `<div class="empty">Failed to fetch issues.json: ${escapeHtml(e.message)}.<br>Serve this directory over HTTP, e.g. <code>python3 -m http.server</code>.</div>`;
      return;
    }
    if (!res.ok) {
      $("content").innerHTML = `<div class="empty">issues.json: HTTP ${res.status}</div>`;
      return;
    }

    // Stream the body so we can show real download progress.
    const total = parseInt(res.headers.get("content-length") || "0", 10);
    const reader = res.body && res.body.getReader ? res.body.getReader() : null;
    let text;
    if (reader) {
      const chunks = [];
      let received = 0;
      if (total) bar.max = total; else bar.removeAttribute("value"); // indeterminate
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (total) {
          bar.value = received;
          label.textContent = `Loading issues.json… ${fmtBytes(received)} / ${fmtBytes(total)} (${((received / total) * 100).toFixed(0)}%)`;
        } else {
          label.textContent = `Loading issues.json… ${fmtBytes(received)}`;
        }
      }
      text = await new Blob(chunks).text();
    } else {
      text = await res.text();
    }

    label.textContent = "Parsing…";
    bar.removeAttribute("value");
    // Yield to the browser so the "Parsing…" label paints before the JSON.parse blocks.
    await new Promise(r => setTimeout(r, 0));
    const data = JSON.parse(text);
    state.all = flatten(data);
    document.title = `MDN Flawless (${state.all.length.toLocaleString()} issues)`;
    const t1 = performance.now();

    bind();
    readHashIntoInputs();
    applyFilters();
    window.addEventListener("hashchange", () => {
      readHashIntoInputs();
      applyFilters();
    });
    console.log(`Loaded ${state.all.length} issues in ${(t1 - t0).toFixed(0)}ms`);
  }

  load();
})();
</script>
